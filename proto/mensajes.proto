syntax = "proto3";

package pe_u1;

// Intercambio de solicitudes y acuses entre los tres nodos de la práctica.
service Mensajeria {
  // Recibe un mensaje con reloj Lamport y confirma su identificador.
  rpc EnviarMensaje(Mensaje) returns (Acuse);
}

message Mensaje {
  string sender = 1;
  int64 timestamp = 2;
  string message = 3;
  string message_id = 4;
}

message Acuse {
  string sender = 1;
  int64 timestamp = 2;
  string message = 3;
  string message_id = 4;
  string ack_for = 5;
  bool ok = 6;
}
